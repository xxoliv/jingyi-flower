<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>静依的花</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:#08070a;color:#cfc9c0;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;
    overflow:hidden;-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(circle at 50% 15%, rgba(120,30,30,0.13), transparent 60%),
      radial-gradient(circle at 85% 85%, rgba(60,20,40,0.08), transparent 55%);
    transition:background 2s;
  }
  body.dread::before{
    background:
      radial-gradient(circle at 50% 40%, rgba(160,20,20,0.22), transparent 70%),
      radial-gradient(circle at 20% 80%, rgba(80,10,30,0.15), transparent 60%);
  }

  /* ============ 标题屏 ============ */
  #title-screen{
    position:fixed;inset:0;z-index:20;
    display:flex;align-items:center;justify-content:center;
    background:#08070a;transition:opacity .9s ease;
    overflow-y:auto;
  }
  #title-screen.hidden{opacity:0;pointer-events:none;}
  .title-inner{text-align:center;padding:2.4rem 2rem;max-width:90vw;}
  .flower-mark{
    display:block;font-size:2.6rem;color:#8b2f2f;margin-bottom:1.8rem;
    animation:breathe 5s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.4;transform:scale(1);}50%{opacity:1;transform:scale(1.06);}}
  h1{
    font-size:2rem;letter-spacing:.45em;font-weight:normal;
    color:#e0d8cc;margin-bottom:1.2rem;text-indent:.45em;
  }
  .subtitle{font-size:.82rem;color:#5c5750;letter-spacing:.2em;margin-bottom:3rem;}
  #start-btn{
    background:transparent;border:1px solid #4a2020;color:#c9a5a5;
    padding:.85rem 2.8rem;font-size:.95rem;font-family:inherit;
    letter-spacing:.35em;text-indent:.35em;cursor:pointer;transition:all .35s;
  }
  #start-btn:hover,#start-btn:active{
    background:#180808;border-color:#8b2f2f;color:#e8ddd0;
  }
  .hint{margin-top:2.2rem;font-size:.7rem;color:#3a3632;letter-spacing:.15em;}

  /* ============ 结局回廊 ============ */
  #endings-list{
    margin-top:3rem;
    font-size:.8rem;
    letter-spacing:.14em;
    line-height:2.1;
    min-height:1em;
  }
  #endings-list .el-title{
    font-size:.7rem;color:#5a4a4a;
    letter-spacing:.5em;text-indent:.5em;
    margin-bottom:1rem;
    position:relative;
  }
  #endings-list .el-title::before,
  #endings-list .el-title::after{
    content:'—';color:#3a2a2a;margin:0 .8em;
  }
  .ending-link{
    display:block;
    width:100%;
    background:transparent;
    border:none;
    border-left:2px solid transparent;
    color:#4a4540;
    font-family:inherit;
    font-size:.82rem;
    letter-spacing:.18em;
    padding:.45rem 1rem;
    margin:.2rem 0;
    cursor:pointer;
    text-align:left;
    transition:all .3s;
    border-radius:2px;
  }
  .ending-link.locked{
    opacity:.45;
    cursor:default;
    letter-spacing:.4em;
    text-indent:.4em;
  }
  .ending-link.got:hover,.ending-link.got:active{
    border-left-color:currentColor;
    background:rgba(255,255,255,.03);
    padding-left:1.4rem;
    filter:brightness(1.2);
  }
  .ending-link .el-arrow{
    float:right;
    opacity:.5;
    font-size:.75rem;
  }

  /* ============ 游戏屏 ============ */
  #game{position:fixed;inset:0;display:flex;flex-direction:column;z-index:5;}
  #game.hidden{display:none;}

  /* ===== HUD ===== */
  #hud{
    display:flex;justify-content:space-between;align-items:center;
    padding:1.1rem 1.4rem;
    letter-spacing:.22em;
    border-bottom:1px solid rgba(139,47,47,.4);
    background:linear-gradient(180deg, rgba(30,16,16,.75), rgba(15,10,10,.35));
    box-shadow:0 2px 18px rgba(120,30,30,.14);
    flex-shrink:0;
    padding-top:max(1.1rem, env(safe-area-inset-top));
    position:relative;
    z-index:2;
  }
  #hud::after{
    content:'';
    position:absolute;left:10%;right:10%;bottom:-1px;height:1px;
    background:linear-gradient(90deg, transparent, rgba(180,60,60,.6), transparent);
    pointer-events:none;
  }
  #hud-left{display:flex;align-items:center;gap:.75rem;}
  #hud-right{display:flex;align-items:center;gap:.85rem;}

  #back-btn{
    background:transparent;
    border:1px solid rgba(139,47,47,.45);
    color:#c9a5a5;
    font-family:inherit;
    font-size:.95rem;
    line-height:1;
    width:1.9rem;
    height:1.9rem;
    border-radius:50%;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:all .3s;
    flex-shrink:0;
  }
  #back-btn:hover:not(:disabled){
    background:rgba(120,30,30,.22);
    border-color:#8b2f2f;
    color:#f0e0d5;
    transform:translateX(-2px);
  }
  #back-btn:disabled{
    opacity:.22;
    cursor:not-allowed;
  }

  #music-btn{
    background:transparent;
    border:1px solid rgba(139,47,47,.35);
    color:#c9a5a5;
    width:1.9rem;
    height:1.9rem;
    border-radius:50%;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:all .4s;
    position:relative;
    flex-shrink:0;
  }
  #music-btn:hover{
    background:rgba(120,30,30,.2);
    border-color:#8b2f2f;
    color:#f0e0d5;
  }
  #music-btn svg{
    width:12px;height:12px;
    transition:opacity .4s;
  }
  #music-btn.muted{
    opacity:.5;
  }
  #music-btn.muted svg{
    opacity:.4;
  }
  #music-btn.muted::after{
    content:'';
    position:absolute;
    width:1.4rem;height:1px;
    background:currentColor;
    transform:rotate(-45deg);
    opacity:.85;
    pointer-events:none;
  }
  #music-btn.playing{
    animation:musicPulse 3.2s ease-in-out infinite;
  }
  @keyframes musicPulse{
    0%,100%{ box-shadow:0 0 0 rgba(180,60,60,0); }
    50%    { box-shadow:0 0 12px rgba(180,60,60,.5); }
  }

  #chapter-name{
    font-size:.95rem;
    color:#e0b6b6;
    letter-spacing:.28em;
    text-shadow:0 0 14px rgba(200,90,90,.45), 0 0 30px rgba(139,47,47,.25);
    font-weight:500;
    position:relative;
    padding-left:1.4em;
    transition:color .6s, text-shadow .6s;
  }
  #chapter-name::before{
    content:'❖';
    position:absolute;left:0;top:50%;transform:translateY(-50%);
    color:#8b2f2f;
    font-size:.75em;
    text-shadow:0 0 10px rgba(200,60,60,.55);
    animation:markPulse 3.2s ease-in-out infinite;
  }
  @keyframes markPulse{
    0%,100%{opacity:.65; transform:translateY(-50%) scale(1);}
    50%    {opacity:1;   transform:translateY(-50%) scale(1.18);}
  }

  #flower-mark{
    font-size:1.65rem;
    line-height:1;
    display:inline-flex;align-items:center;justify-content:center;
    width:2rem;height:2rem;
    transition:all .9s cubic-bezier(.2,.7,.3,1);
  }
  #flower-mark[data-state="empty"]{
    color:#3a2a2a;text-shadow:0 0 0 transparent;opacity:.7;
  }
  #flower-mark[data-state="sprout"]{
    color:#7aa55e;
    text-shadow:0 0 16px rgba(122,165,94,.65), 0 0 32px rgba(90,140,60,.3);
    animation:flowerSprout 2.6s ease-in-out infinite;
  }
  #flower-mark[data-state="bud"]{
    color:#c48ad0;
    text-shadow:0 0 18px rgba(196,138,208,.7), 0 0 36px rgba(150,80,180,.35);
    animation:flowerBud 2.2s ease-in-out infinite;
  }
  #flower-mark[data-state="bloom"]{
    color:#f04040;
    text-shadow:0 0 22px rgba(240,64,64,.85), 0 0 44px rgba(200,30,30,.55), 0 0 70px rgba(160,10,10,.3);
    animation:flowerBloom 1.6s ease-in-out infinite;
  }
  #flower-mark[data-state="wither"]{
    color:#6a5a5a;
    text-shadow:0 0 12px rgba(120,90,90,.4);
    animation:flowerWither 4s ease-in-out infinite;
  }
  @keyframes flowerSprout{
    0%,100%{ opacity:.8; transform:scale(1) rotate(0); }
    50%    { opacity:1;  transform:scale(1.1) rotate(-4deg); }
  }
  @keyframes flowerBud{
    0%,100%{ opacity:.85; transform:scale(1); }
    50%    { opacity:1;   transform:scale(1.14); }
  }
  @keyframes flowerBloom{
    0%,100%{ transform:scale(1); text-shadow:0 0 18px rgba(240,64,64,.7), 0 0 36px rgba(200,30,30,.45), 0 0 60px rgba(160,10,10,.25); }
    50%    { transform:scale(1.2); text-shadow:0 0 28px rgba(255,80,80,1), 0 0 56px rgba(220,40,40,.7), 0 0 90px rgba(180,10,10,.45); }
  }
  @keyframes flowerWither{
    0%,100%{ opacity:.6; }
    50%    { opacity:.85; }
  }

  #scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
  #content{max-width:660px;margin:0 auto;padding:2.2rem 1.5rem 6rem;}

  /* ============ CG 显示区 ============ */
  #cg-display{
    margin:0 auto 2.2rem;
    max-width:100%;
    text-align:center;
    opacity:0;
    animation:cgFadeIn 1.8s ease .2s forwards;
  }
  @keyframes cgFadeIn{
    from{opacity:0; transform:translateY(14px) scale(.97); filter:blur(6px);}
    to  {opacity:1; transform:translateY(0)    scale(1);  filter:blur(0);}
  }
  #cg-display svg{
    display:block;
    width:100%;
    max-width:420px;
    height:auto;
    margin:0 auto;
    filter:drop-shadow(0 0 32px rgba(120,30,30,.28));
  }
  #cg-display img{
    display:block;
    max-width:100%;
    margin:0 auto;
    border:1px solid rgba(139,47,47,.3);
    box-shadow:0 0 40px rgba(120,30,30,.2);
  }
  .cg-caption{
    margin-top:.9rem;
    font-size:.72rem;
    color:#5c5750;
    letter-spacing:.35em;
    text-indent:.35em;
  }

  /* ============ 段落 ============ */
  .para{
    margin-bottom:1.35em;line-height:2.05;font-size:1.02rem;
    color:#cbc5bc;opacity:0;
    animation:fadeUp .9s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ============ 文本特效 ============ */
  .fx-flicker{ animation: fadeUp .4s ease forwards, flicker 1.4s ease .4s; }
  @keyframes flicker{
    0%,100%{opacity:1;}
    8%{opacity:.25;} 10%{opacity:.9;}
    14%{opacity:.4;} 16%{opacity:1;}
    52%{opacity:.75;} 54%{opacity:1;}
  }
  .fx-shake{ animation: fadeUp .5s ease forwards, shake .55s ease-in-out .5s; }
  @keyframes shake{
    0%,100%{transform:translate(0,0);}
    15%{transform:translate(-3px,1px);}
    30%{transform:translate(3px,-1px);}
    45%{transform:translate(-2px,2px);}
    60%{transform:translate(2px,-2px);}
    75%{transform:translate(-1px,1px);}
    90%{transform:translate(1px,-1px);}
  }
  .fx-glitch{
    animation: fadeUp .6s ease forwards, glitch 2.2s steps(2) .6s;
    text-shadow:0 0 0 transparent;
  }
  @keyframes glitch{
    0%{text-shadow:none;color:#cbc5bc;}
    10%{text-shadow:-2px 0 #b03030, 2px 0 #3048b0;color:#d8c0c0;}
    20%{text-shadow:2px 0 #b03030, -2px 0 #3048b0;color:#cbc5bc;}
    30%{text-shadow:-1px 1px #b03030, 1px -1px #3048b0;}
    45%{text-shadow:none;color:#cbc5bc;}
    100%{text-shadow:none;color:#cbc5bc;}
  }
  .fx-bleed{ animation: fadeUp .9s ease forwards, bleed 3s ease 1s forwards; }
  @keyframes bleed{
    0%{color:#cbc5bc;}
    40%{color:#9a6a6a;}
    100%{color:#7a2f2f;}
  }
  .fx-whisper{
    font-size:.92rem;color:#7c746c;font-style:italic;
    letter-spacing:.06em;padding-left:1.4em;
  }
  .fx-whisper::before{ content:'“';color:#4a4540;margin-right:.2em; }
  .fx-whisper::after{ content:'”';color:#4a4540;margin-left:.2em; }
  .fx-dread{
    color:#a05a5a;
    animation: fadeUp .9s ease forwards, dreadPulse 2.6s ease-in-out 1s infinite;
  }
  @keyframes dreadPulse{
    0%,100%{text-shadow:0 0 0 transparent;}
    50%{text-shadow:0 0 18px rgba(180,40,40,.5);}
  }
  .para.chapter-title{
    text-align:center;color:#9c6b6b;font-size:1.1rem;
    letter-spacing:.6em;text-indent:.6em;
    margin:1.5em 0 1.8em;
  }

  /* ============ 结局染色 ============ */
  .ending-colored .para{transition:color 1.2s ease;}
  .ending-colored.ending-reborn .para      { color:#d4b87a; }
  .ending-colored.ending-symbiosis .para   { color:#a89cc8; }
  .ending-colored.ending-assimilate .para  { color:#a85a5a; }
  .ending-colored.ending-oblivion .para    { color:#858585; }
  .ending-colored.ending-eternalnight .para{ color:#c83232; }

  .ending-mark{
    text-align:center;margin:3.4rem 0 1.6rem;
    font-size:1.02rem;letter-spacing:.6em;text-indent:.6em;
    animation:fadeUp 1.2s ease forwards;opacity:0;color:inherit;
  }
  .ending-colored.ending-reborn .ending-mark{color:#e8c98a;text-shadow:0 0 30px rgba(212,184,122,.45);}
  .ending-colored.ending-symbiosis .ending-mark{color:#c0b4dc;text-shadow:0 0 30px rgba(168,156,200,.45);}
  .ending-colored.ending-assimilate .ending-mark{color:#c07070;text-shadow:0 0 30px rgba(168,90,90,.45);}
  .ending-colored.ending-oblivion .ending-mark{color:#909090;text-shadow:0 0 30px rgba(133,133,133,.3);}
  .ending-colored.ending-eternalnight .ending-mark{
    color:#e03030;animation:bloodPulse 2.4s ease-in-out infinite;
    text-shadow:0 0 40px rgba(200,50,50,.6);
  }
  @keyframes bloodPulse{
    0%,100%{ text-shadow:0 0 30px rgba(200,50,50,.5); }
    50%    { text-shadow:0 0 60px rgba(220,40,40,.95), 0 0 90px rgba(180,20,20,.5); }
  }

  /* ============ 继续按钮 ============ */
  .next-btn{
    display:block;width:100%;text-align:center;
    margin:2rem auto .5rem;padding:1rem 1.4rem;
    background:transparent;
    border:1px solid rgba(139,47,47,.35);
    color:#c9a5a5;font-family:inherit;font-size:.92rem;
    letter-spacing:.4em;text-indent:.4em;
    cursor:pointer;transition:all .3s;
    opacity:0;animation:fadeUp .6s ease .35s forwards;
  }
  .next-btn:hover,.next-btn:active{
    background:rgba(120,30,30,.15);
    border-color:#8b2f2f;color:#f0e0d5;
  }
  .next-btn .arrow{
    display:inline-block;margin-left:.4em;
    transition:transform .35s;
  }
  .next-btn:hover .arrow{transform:translateX(6px);}

  /* ============ 选项 ============ */
  #choices{margin-top:2.4rem;}
  .choice{
    display:block;width:100%;text-align:left;
    background:transparent;border:none;
    border-left:2px solid #3a2020;
    color:#a8a29a;font-family:inherit;font-size:.98rem;
    padding:.95rem 1.2rem;margin-bottom:.85rem;
    cursor:pointer;transition:all .3s;line-height:1.75;
    opacity:0;animation:fadeUp .7s ease forwards;
  }
  .choice .inner{
    display:block;font-size:.82rem;color:#6a635c;
    margin-top:.35em;font-style:italic;letter-spacing:.03em;
  }
  .choice:hover .inner,.choice:active .inner{color:#9c8a80;}
  .choice:hover,.choice:active{
    border-left-color:#c04040;color:#e6ddd2;
    background:linear-gradient(90deg, rgba(120,30,30,.12), transparent);
    padding-left:1.7rem;
  }
  .choice.special{border-left-color:#6b3030;color:#c9a5a5;}
  .choice.special:hover{border-left-color:#c44;color:#f0e0d5;}

  /* ============ 结局操作按钮 ============ */
  .restart-btn, .home-btn{
    display:block;margin:1.4rem auto 0;
    padding:1rem 3rem;background:transparent;
    border:1px solid currentColor;
    color:inherit;font-family:inherit;font-size:.95rem;
    letter-spacing:.42em;text-indent:.42em;cursor:pointer;
    opacity:0;animation:fadeUp 1s ease .9s forwards;
    transition:background .35s, box-shadow .35s;
  }
  .restart-btn{ margin-top:2.2rem; }
  .restart-btn:hover,.restart-btn:active,
  .home-btn:hover,.home-btn:active{
    background:rgba(255,255,255,.06);
    box-shadow:0 0 24px rgba(255,255,255,.08);
  }
  .home-btn{ animation-delay:1.15s; }

  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#2a2422;border-radius:3px;}

  @media (max-width:520px){
    .para{font-size:.98rem;line-height:2;}
    h1{font-size:1.6rem;letter-spacing:.35em;text-indent:.35em;}
    #content{padding:1.6rem 1.2rem 5rem;}
    .restart-btn, .home-btn{font-size:.85rem;padding:.9rem 2.2rem;}
    .next-btn{font-size:.85rem;padding:.9rem 1rem;}
    #chapter-name{font-size:.82rem;letter-spacing:.22em;}
    #flower-mark{font-size:1.4rem;width:1.7rem;height:1.7rem;}
    #cg-display svg{max-width:300px;}
    .cg-caption{font-size:.66rem;}
    #back-btn,#music-btn{width:1.7rem;height:1.7rem;font-size:.85rem;}
    #music-btn svg{width:10px;height:10px;}
  }
</style>
</head>
<body>

<div id="title-screen">
  <div class="title-inner">
    <span class="flower-mark">✿</span>
    <h1>静依的花</h1>
    <p class="subtitle">一个关于目光、沉默与盛开的故事</p>
    <button id="start-btn">开始</button>
    <p class="hint">点击屏幕或“继续”按钮推进文本</p>
    <div id="endings-list"></div>
  </div>
</div>

<div id="game" class="hidden">
  <header id="hud">
    <div id="hud-left">
      <button id="back-btn" title="回到上一节点" aria-label="回到上一节点">‹</button>
      <span id="chapter-name">序章</span>
    </div>
    <div id="hud-right">
      <button id="music-btn" class="playing" title="背景音乐" aria-label="背景音乐">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 3v10.55A4 4 0 1014 17V7h4V3h-6z"/>
        </svg>
      </button>
      <span id="flower-mark" data-state="empty">◌</span>
    </div>
  </header>
  <main id="scroll">
    <div id="content">
      <div id="cg-display"></div>
      <div id="text"></div>
      <div id="choices"></div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   ★ 音频系统 · 中国风双轨音乐 + 音效 ★
   五声音阶 · 古琴/笛子/磬 三种音色 · 动态切换
============================================================ */

/* ---------- 音效 ---------- */
const SFX = {
  ctx: null,
  outGain: null,

  init(ctx) {
    this.ctx = ctx;
    this.outGain = ctx.createGain();
    this.outGain.gain.value = 0.55;
    this.outGain.connect(ctx.destination);
  },

  /* 木鱼 · 点击选项 */
  click() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(640, t);
    osc.frequency.exponentialRampToValueAtTime(320, t + 0.06);

    filter.type = 'lowpass';
    filter.frequency.value = 1400;
    filter.Q.value = 2;

    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.18, t + 0.004);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.09);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.outGain);
    osc.start(t);
    osc.stop(t + 0.11);
  },

  /* 轻柔翻页 · 推进文本 */
  advance() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = 1320;

    gain.gain.setValueAtTime(0.028, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);

    osc.connect(gain);
    gain.connect(this.outGain);
    osc.start(t);
    osc.stop(t + 0.07);
  },

  /* 磬 · 章节进入 / 关键节点 */
  chime() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const base = 528;
    const dur = 2.4;
    const components = [1, 2.756, 5.404];
    const weights = [1, 0.32, 0.16];

    const outGain = this.ctx.createGain();
    outGain.gain.setValueAtTime(0, t);
    outGain.gain.linearRampToValueAtTime(0.16, t + 0.008);
    outGain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    outGain.connect(this.outGain);

    components.forEach((mult, i) => {
      const osc = this.ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = base * mult;
      const g = this.ctx.createGain();
      g.gain.value = weights[i];
      osc.connect(g);
      g.connect(outGain);
      osc.start(t);
      osc.stop(t + dur + 0.1);
    });
  },

  /* 花开 · 五声上行琶音 */
  bloom() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const notes = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
    notes.forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const g = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const when = t + i * 0.09;
      g.gain.setValueAtTime(0, when);
      g.gain.linearRampToValueAtTime(0.11, when + 0.012);
      g.gain.exponentialRampToValueAtTime(0.001, when + 1.4);
      osc.connect(g);
      g.connect(this.outGain);
      osc.start(when);
      osc.stop(when + 1.5);
    });
  },

  /* 故障音 · glitch */
  glitch() {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const bufSize = this.ctx.sampleRate * 0.15;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2);
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 800;
    filter.Q.value = 5;
    const g = this.ctx.createGain();
    g.gain.value = 0.08;
    src.connect(filter);
    filter.connect(g);
    g.connect(this.outGain);
    src.start(t);
  }
};

    /* C 宫调式（对应 C 大调）：C D E G A */
    B: [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25, 783.99, 880.00, 1046.50]
  },

  /* 和弦进行（8 小节循环，低音 + 琶音，全部在五声音阶内） */
  progressions: {
    A: [
      { bass: 110.00, notes: [220.00, 261.63, 329.63] },  // Am
      { bass:  98.00, notes: [196.00, 293.66, 392.00] },  // G

      { bass:  73.42, notes: [146.83, 220.00, 293.66] },  // Dm

      { bass:  73.42, notes: [146.83, 220.00, 440.00] },  // Dm 高音
      { bass: 130.81, notes: [261.63, 329.63, 392.00] },  // C
      { bass: 110.00, notes: [220.00, 261.63, 329.63] }   // Am
    ],
    B: [
      { bass: 130.81, notes: [261.63, 329.63, 392.00] },  // C
      { bass: 110.00, notes: [220.00, 261.63, 329.63] },  // Am
      { bass:  98.00, notes: [196.00, 293.66, 392.00] },  // G
      { bass:  82.41, notes: [164.81, 196.00, 261.63] },  // Em
      { bass: 130.81, notes: [261.63, 329.63, 392.00] },  // C
      { bass: 110.00, notes: [220.00, 261.63, 329.63] },  // Am
      { bass:  98.00, notes: [196.00, 293.66, 392.00] },  // G
      { bass: 130.81, notes: [261.63, 329.63, 523.25] }   // C 高
    ]
  },

  init() {
    if (this.ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try {
      this.ctx = new AC();
    } catch(e) { return false; }

    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0;
    this.masterGain.connect(this.ctx.destination);

    /* 双延迟混响 —— 制造空旷的回响 */
    const delay1 = this.ctx.createDelay(3);
    delay1.delayTime.value = 0.42;
    const delay2 = this.ctx.createDelay(3);
    delay2.delayTime.value = 0.58;
    const fb1 = this.ctx.createGain();
    fb1.gain.value = 0.32;
    const fb2 = this.ctx.createGain();
    fb2.gain.value = 0.26;
    delay1.connect(fb1);
    fb1.connect(delay2);
    delay2.connect(fb2);
    fb2.connect(delay1);

    const wetGain = this.ctx.createGain();
    wetGain.gain.value = 0.45;
    delay1.connect(wetGain);
    delay2.connect(wetGain);
    wetGain.connect(this.masterGain);

    this.reverbInput = this.ctx.createGain();
    this.reverbInput.gain.value = 1;
    this.reverbInput.connect(delay1);
    this.reverbInput.connect(delay2);

    SFX.init(this.ctx);
    return true;
  },

  /* ==== 音色 1 · 古琴拨弦 ==== */
  playPluck(freq, when, dur, vol) {
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();

    osc1.type = 'triangle';
    osc1.frequency.value = freq;
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2.005;

    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(Math.max(freq * 6, 2000), when);
    filter.frequency.exponentialRampToValueAtTime(Math.max(freq * 2, 700), when + dur);
    filter.Q.value = 1.2;

    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(vol, when + 0.008);
    gain.gain.exponentialRampToValueAtTime(vol * 0.3, when + dur * 0.32);
    gain.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    osc1.connect(filter);
    osc2.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    gain.connect(this.reverbInput);

    osc1.start(when);
    osc2.start(when);
    osc1.stop(when + dur + 0.05);
    osc2.stop(when + dur + 0.05);
  },

  /* ==== 音色 2 · 笛子 ==== */
  playFlute(freq, when, dur, vol) {
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    const vibrato = this.ctx.createOscillator();
    const vibGain = this.ctx.createGain();

    osc.type = 'sine';
    osc.frequency.value = freq;

    vibrato.type = 'sine';
    vibrato.frequency.value = 5.2;
    vibGain.gain.value = freq * 0.004;
    vibrato.connect(vibGain);
    vibGain.connect(osc.frequency);

    filter.type = 'lowpass';
    filter.frequency.value = Math.max(freq * 3, 1500);
    filter.Q.value = 0.5;

    gain.gain.setValueAtTime(0, when);
    gain.gain.linearRampToValueAtTime(vol, when + dur * 0.22);
    gain.gain.linearRampToValueAtTime(vol * 0.85, when + dur * 0.65);
    gain.gain.linearRampToValueAtTime(0, when + dur);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.masterGain);
    gain.connect(this.reverbInput);

    vibrato.start(when);
    osc.start(when);
    vibrato.stop(when + dur + 0.05);
    osc.stop(when + dur + 0.05);
  },

  /* ==== 音色 3 · 磬/铃（装饰性） ==== */
  playBell(freq, when, vol) {
    const dur = 3.2;
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    const osc3 = this.ctx.createOscillator();
    const g1 = this.ctx.createGain();
    const g2 = this.ctx.createGain();
    const g3 = this.ctx.createGain();

    osc1.type = 'sine';
    osc1.frequency.value = freq;
    osc2.type = 'sine';
    osc2.frequency.value = freq * 2.756;
    osc3.type = 'sine';
    osc3.frequency.value = freq * 5.404;

    g1.gain.value = 1;
    g2.gain.value = 0.3;
    g3.gain.value = 0.15;

    osc1.connect(g1);
    osc2.connect(g2);
    osc3.connect(g3);

    const outGain = this.ctx.createGain();
    g1.connect(outGain);
    g2.connect(outGain);
    g3.connect(outGain);

    outGain.gain.setValueAtTime(0, when);
    outGain.gain.linearRampToValueAtTime(vol, when + 0.006);
    outGain.gain.exponentialRampToValueAtTime(vol * 0.4, when + 0.35);
    outGain.gain.exponentialRampToValueAtTime(0.0001, when + dur);

    outGain.connect(this.masterGain);
    outGain.connect(this.reverbInput);

    osc1.start(when);
    osc2.start(when);
    osc3.start(when);
    osc1.stop(when + dur + 0.1);
    osc2.stop(when + dur + 0.1);
    osc3.stop(when + dur + 0.1);
  },

  /* ==== 一个小节 ==== */
  playBar() {
    if (!this.ctx || !this.isPlaying) return;

    /* 曲目切换（延迟到小节边界，避免突兀） */
    if (this._pendingTrack && this._pendingTrack !== this.currentTrack) {
      this.currentTrack = this._pendingTrack;
      this._pendingTrack = null;
      this.chordIndex = 0;
    }

    const t = this.ctx.currentTime + 0.02;
    const progression = this.progressions[this.currentTrack];
    const chord = progression[this.chordIndex % progression.length];
    const scale = this.scales[this.currentTrack];

    /* 1. 低音 · 古琴 */
    this.playPluck(chord.bass, t, 4.4, 0.09);
    this.playPluck(chord.bass * 2, t + 0.02, 3.8, 0.04);

    /* 2. 琶音 · 古琴 */
    chord.notes.forEach((freq, i) => {
      const when = t + i * 0.42 + Math.random() * 0.05;
      const dur = 2.6 - i * 0.1;
      const vol = 0.085 - i * 0.01;
      this.playPluck(freq, when, dur, vol);
    });

    /* 3. 随机旋律 · 笛子（每次不同，避免重复感） */
    const noteCount = 3 + Math.floor(Math.random() * 3);
    let cursor = t + 0.9;
    let lastIdx = -1;
    for (let i = 0; i < noteCount; i++) {
      let idx;
      do {
        idx = Math.floor(Math.random() * scale.length);
      } while (idx === lastIdx && scale.length > 1);
      lastIdx = idx;

      const note = scale[idx];
      const dur = 0.75 + Math.random() * 1.1;
      const vol = 0.042 + Math.random() * 0.025;

      this.playFlute(note, cursor, dur, vol);
      cursor += 0.55 + Math.random() * 0.6;
      if (cursor > t + 3.3) break;
    }

    /* 4. 偶尔的磬/铃装饰 */
    if (Math.random() < 0.35) {
      const bellIdx = 7 + Math.floor(Math.random() * 3);
      const bellNote = scale[bellIdx % scale.length];
      this.playBell(bellNote, t + 1.4 + Math.random() * 1.6, 0.032);
    }

    /* 5. 偶尔的高八度回声 */
    if (Math.random() < 0.25) {
      const echoIdx = Math.floor(Math.random() * 5);
      const echoNote = scale[echoIdx] * 2;
      this.playFlute(echoNote, t + 2.8 + Math.random() * 0.4, 1.2, 0.028);
    }

    this.chordIndex++;
    this.nextTimeout = setTimeout(() => this.playBar(), 3600);
  },

  setTrack(track) {
    if (track === this.currentTrack && !this._pendingTrack) return;
    this._pendingTrack = track;
  },

  start() {
    if (!this.init()) return;
    if (this.isPlaying) return;
    if (this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    this.isPlaying = true;

    const now = this.ctx.currentTime;
    const g = this.masterGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(Math.max(g.value, 0), now);
    g.linearRampToValueAtTime(0.2, now + 3.0);

    this.chordIndex = 0;
    this.playBar();
  },

  stop() {
    if (!this.ctx || !this.isPlaying) return;
    this.isPlaying = false;
    if (this.nextTimeout) {
      clearTimeout(this.nextTimeout);
      this.nextTimeout = null;
    }
    const now = this.ctx.currentTime;
    const g = this.masterGain.gain;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(0, now + 1.2);
  },

  toggle() {
    if (this.isPlaying) this.stop();
    else this.start();
  }
};

    '她的成绩从班级中流一路下滑到吊车尾。贺彬稳稳保持中上游，这为他嗤笑静依多了一个理由：“丑就算了，还蠢。”',
    '调换同桌需要多方协调。但静依的名声被贺彬搞臭，老师询问多人，没有得到同意的回答。',
    '你主动表示愿意和静依坐。全班震惊。',
    '静依却一口否决了。',
    '“不用。”她说，语气冰冷。',
    '你不知道自己做错了什么。静依宁愿忍受贺彬的嘲弄，继续跟他坐在一起。',
    {t:'你被背叛了。你非常受伤。', fx:'flicker'},
    {t:'——但你更受伤的是，那盆花。', fx:'whisper'},
    {t:'那盆你说过每天去浇水的花，你忽然发现，你已经整整四天没有靠近过它了。', fx:'whisper'},
    {t:'可它的土壤，还是湿的。', fx:'dread'}
  ],

ch5_vanish: {
  chapter:'第五章', title:'消失', flower:'sprout',
  cg:'sprout', music:'A',
  text:[
    {t:'第五章 · 消失', fx:'chapter'},
    '初二开学三周后，静依消失了。',
    '那是一个再平常不过的午后。语文课堂上，你一边听课一边在书上随手涂鸦，渐渐画出了一只眼睛。',
    '看到这只眼睛，你猛地觉得很眼熟。下意识向那个曾很熟悉的方向看去——',
    {t:'空空如也。', fx:'shake'},
    '你不记得自己是怎么意识到这件事的。你只知道，从那一刻起，你脑子里所有关于静依的记忆，忽然变得异常清晰，又异常遥远。',
    {t:'像隔着一层水。', fx:'whisper'},
    '下课后，耳边是男生们无法忽略的尖锐笑声，眼下是一个干裂的空花盆。时隔许久，你再次用杯子给静依的花浇水。',
    '在一排盛开而争奇斗艳的花丛里，静依的花盆仍旧光秃秃的，仿佛停滞在了最初最初的时节。',
    '你开始观察静依的花。你向其他人询问静依的事情，却没有得到任何确切的答案。',
    {t:'“她谁啊？”', fx:'whisper'},
    {t:'“有这个人吗？”', fx:'whisper'},
    {t:'“你怎么最近老问这种怪问题？”', fx:'whisper'},
    '直到有一天，花盆里长出来了东西。',
    '带着一点特殊的气味。',
    '是之前难得和静依擦肩而过时，她身上的气味。是静依的气味。',
    '你欣喜若狂。似乎这就能说明静依好起来了。她在好起来了。',
    {t:'花开那一天，她会回学校来吗？', fx:'dread'}
  ],
  next:'ch5_bud'
},

ch5_bud: {
  chapter:'第五章', title:'花苞', flower:'bud',
  cg:'bud', music:'B',
  text:[

ch6_night: {
  chapter:'第六章', title:'夜晚', flower:'bud',
  cg:'night', music:'A',
  text:[
    {t:'第六章 · 夜晚', fx:'chapter'},
    '因为太过激动，加上今天自己小组做值日，导致你忘带了作业本。你只好折返回学校。',
    '晚自习下了以后，天已经完全黑了。你从学校的小门挤进去，溜进了教学楼。班级在五楼，楼梯上你清点着要拿的东西。',
    '快走到教室门口，你才发现教室的门开着一条缝。',
    '怎么会呢？你记得自己和同学做完卫生是关好了门才走的。',
    {t:'——你确定吗？', fx:'whisper'},
    '你有些紧张，悄悄走近门缝。',
    '教室里没有开灯。淡淡的、冷冷的月光下，一个漆黑的人影站在窗台前。你有点近视，平时上课会戴上眼镜，加上环境很暗，你努力睁大眼睛去看。',
    '那个人影窸窸窣窣地摆弄着，发出低沉的、呜呜咽咽的声音。',
    {t:'那声音像有人在哭。又像有人在往土里埋什么东西。', fx:'dread'},
    '你看清了——人影是在对着窗台上的植物们做着什么。',
    '你担忧起静依的花来。',
    '你鼓起勇气，找准了教室后的灯，猛地打开，大声质问：“是谁？！”',
    {t:'啪——', fx:'shake'},
    '人影被突然亮起的灯吓得跳起，转过身来。',
    '你看到了满脸泪痕的静依。',
    '——不。',
    {t:'你看到的是一张脸。你非常肯定那是静依的脸。', fx:'glitch'},
    {t:'可你又觉得，那不完全是。她的眼睛还是那两粒浸了水的石子，黑得发亮。但你没有看到月牙。', fx:'glitch'},
    {t:'你没有看到月牙。', fx:'glitch'},
    '她捂着手腕，一个东西从她指尖猛然掉落，发出清脆的金属响声。',
    '静依瞪大了眼睛，显然没料到会有人回来。她冲出了教室，快得像一个真正的影子。',
    '你甚至没抓住她的一根发丝。转瞬间，静依消失在楼道。'
  ],
  choices:[
    { text:'追出去',
      inner:'（不管那是不是她。你只知道，你不能再一次看着她跑掉了。）',
      next:'d1', effects:{ flag:'seed' } },
    { text:'不追。回到教室，慢慢走向窗台',
      inner:'（你追不上。但你必须去看看那盆花。你必须知道，刚才那里发生了什么。）',
      next:'d2', effects:{ flag:'investigate' } },
    { text:'不追。关上门，像什么都没发生一样走回家',
      inner:'（不是你的责任。你已经做了太多。就让今晚像所有普通的夜晚一样过去。）',
      next:'d3', effects:{ guilt:+2 } }
  ]
},

  text:[

ch7_bloom: {
  chapter:'第七章', title:'花开', flower:'bloom',
  cg:'bloom', music:'B',
  text:[
    {t:'第七章 · 花开', fx:'chapter'},
    '第三天，你还是顶着黑眼圈回到了学校。',
    '一进门，你发现一群同学围在窗台前。你心里一惊，赶忙挤进去查看。',
    '映入眼帘的是一朵开得极其热烈而绝艳的红色花朵。层层花瓣展开，像血红的纱织铺在漫天的星光里，永恒地旋转、徜徉。',
    '大家惊呼着她的美丽，赞扬着她的动人——包括贺彬。',
    {t:'贺彬说：“这也太好看了吧，谁的花啊？”', fx:'glitch'},
    {t:'他说这句话的时候，脸上带着真诚的惊叹。他完全忘了，这盆花是他每天咒骂的那个人的。', fx:'glitch'},
    '但没人知道这是谁的花。',

    {t:'只有你还记得，那是一个空花盆。', fx:'whisper'},
    '感叹完后，贺彬和其他人又叫那些曾经的朋友们前来观赏。一波一波的人臣服于她夺目的鲜艳。这是枯燥的校园生活里再次出现的乐趣。',
    '你始终沉默着。',
    '第四天，第五天。再美丽的花朵也有溃败的一天。也没有人会再看一朵正在腐烂的花。她再次被议论，被遗忘，直到重新融化在泥土里。',
    {t:'到最后一天，花瓣落在土里，你看了一眼花盆。', fx:'whisper'},
    {t:'土壤上，残留着一些浅褐色的绒毛。', fx:'whisper'},
    {t:'你确信那是属于人的。', fx:'dread'},
    '你和静依的聊天框，最终停留在你发的最后一条消息上。',
    '是一张图片。图片里是窗台前尽情盛放的鲜花。'
  ],
  choices:[

      inner:'（这一次，你不想再睁开眼睛。就让这一切停在血红色的寂静里吧。）',

ending_assimilate: {

ending_symbiosis: {

  text:[
    '你捡起了那颗花种。',
    '你把它种在了一个新的花盆里，放在窗台上。你没有告诉任何人。',
    '那天晚上，你做了一个梦。',
    '梦里你站在一间教室里，墙壁上密密麻麻写满了字。你认出了贺彬清秀隽逸的字、班里最爱接话的男生歪歪扭扭的字、安静内秀的女孩方方正正的字。',
    '你找到了自己的字。',
    '三个字。',
    '“我累了。”',
    {t:'——你不记得自己写过这句话。', fx:'flicker'},
    '你的心突然狠狠痛起来。你不知道是你在痛还是静依在痛。',
    '你摸索着，在裤子口袋里颤颤巍巍地掏出了一张皱皱巴巴的纸条。',
    '上面也是三个字——',
    '“对不起。”',
    {t:'你同样不记得自己写过这句话。', fx:'whisper'},
    {t:'但这一次，你希望它是真的。', fx:'whisper'},
    '重影的字在进入脑海里的刹那发出强烈的光芒。你紧紧闭上了眼睛。',
    '再次睁开眼，你回到了自己的座位上。你不知觉中冒了一身冷汗，陡然坐起身来。',
    '周围仍是一片安静。同学们奇异地都还在午休的迷梦中。直到班主任敲着黑板走进来提示休息时间的结束，大家才迷迷糊糊地醒来，一副惊魂未定的样子。',
    '声音此起彼伏地混杂起来。你听到大家在讨论方才的噩梦，却没有一人记得梦里到底发生了什么，只是都像从水里刚捞出来，以及空前的、不知名的愧疚感。',

/* ============================================================
   引擎
============================================================ */
const $ = id => document.getElementById(id);

let queue   = [];
let waiting = false;
let node    = null;
let nextBtn = null;

const FLOWER_MARKS = { empty:'◌', sprout:'⌇', bud:'❋', bloom:'✿', wither:'·' };

const MUSIC_PREF_KEY = 'jingyi_music';
function getMusicPref(){
  try{
    const v = localStorage.getItem(MUSIC_PREF_KEY);
    return v === null ? true : v === '1';
  }catch(e){ return true; }
}
function setMusicPref(on){
  try{ localStorage.setItem(MUSIC_PREF_KEY, on ? '1' : '0'); }catch(e){}
}
function updateMusicBtn(){
  const btn = $('music-btn');
  if(!btn) return;
  btn.classList.toggle('muted', !Music.isPlaying);
  btn.classList.toggle('playing', Music.isPlaying);
}

function startGame(){
  $('title-screen').classList.add('hidden');
  $('game').classList.remove('hidden');
  resetState();
  history = [];
  replayMode = false;
  loadNode('start');
}

function resetState(){
  state.trust = 0; state.guilt = 0;
  state.flower = 'empty'; state.flags = {}; state.current = null;
}

function loadNode(id){
  const n = NODES[id];
  if(!n){ console.error('Missing node:', id); return; }
  node = n;
  state.current = id;

  if(n.chapter){
    const t = n.title ? ' · ' + n.title : '';
    $('chapter-name').textContent = n.chapter + t;
    if(n.cg === 'scent' || n.text.some(p => p && p.fx === 'chapter')){
      SFX.chime();
    }
  }
  if(n.flower) state.flower = n.flower;
  updateFlower();

  const contentEl = $('content');
  contentEl.className = n.ending ? ('ending-colored ending-' + n.ending) : '';

  const hasDread = n.text.some(p => p && p.fx === 'dread');
  document.body.classList.toggle('dread', !!hasDread || !!n.ending);

  if(n.music) Music.setTrack(n.music);
  if(n.cg === 'bloom') SFX.bloom();

  renderCG(n.cg);

  queue = n.text.slice();
  waiting = false;
  $('text').innerHTML = '';
  $('choices').innerHTML = '';
  $('scroll').scrollTop = 0;

  updateBackBtn();
  revealNext();
}

function renderCG(cgKey){
  const box = $('cg-display');
  box.innerHTML = '';
  if(!cgKey) return;

  const cg = CGS[cgKey];
  if(!cg){ console.warn('Missing CG:', cgKey); return; }

  if(cg.svg){
    box.innerHTML = cg.svg;
  } else if(cg.img){
    const img = document.createElement('img');
    img.src = cg.img;
    img.alt = cg.caption || '';
    box.appendChild(img);
  }

  if(cg.caption){
    const cap = document.createElement('div');
    cap.className = 'cg-caption';
    cap.textContent = cg.caption;
    box.appendChild(cap);
  }
}

function revealNext(){
  if(queue.length === 0) return false;
  const item = queue.shift();

  const p = document.createElement('p');
  p.className = 'para';

  let textStr = item;
  if(typeof item === 'object' && item !== null){
    textStr = item.t;
    if(item.fx) p.classList.add('fx-' + item.fx);
    if(item.fx === 'chapter') p.classList.add('chapter-title');
  }
  p.textContent = textStr;

  $('text').appendChild(p);
  requestAnimationFrame(() => {
    const s = $('scroll'); s.scrollTop = s.scrollHeight;
  });
  return true;
}

function advance(){
  if(waiting) return;
  if($('game').classList.contains('hidden')) return;

  if(queue.length > 0){
    revealNext();
    if(queue.length === 0) showNextButton();
    return;
  }
  finishNode();
}

function finishNode(){
  if(node.choices){
    waiting = true;
    renderChoices(node.choices);
    return;
  }
  if(node.ending){
    waiting = true;
    renderEnding(node.ending);
    return;
  }
  if(node.next){
    pushHistory();
    let nid = node.next;
    if(typeof nid === 'function') nid = nid(state);
    loadNode(nid);
    return;
  }
}

function pushHistory(){
  history.push({
    nodeId: state.current,
    trust: state.trust,
    guilt: state.guilt,
    flower: state.flower,
    flags: { ...state.flags }
  });
}

function goBack(){
  if(history.length === 0) return;
  if(node && node.ending) return;
  const snap = history.pop();
  state.trust = snap.trust;
  state.guilt = snap.guilt;
  state.flower = snap.flower;
  state.flags = { ...snap.flags };
  loadNode(snap.nodeId);
}

function updateBackBtn(){
  const btn = $('back-btn');
  if(!btn) return;
  btn.disabled = history.length === 0 || (node && node.ending);
}

function renderChoices(choices){
  const box = $('choices');
  const valid = choices.filter(c => !c.condition || c.condition(state));
  if(valid.length === 0) valid.push({ text:'……', next:'ending_oblivion' });

  valid.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'choice' + (c.special ? ' special' : '');
    btn.style.animationDelay = (i * 0.12) + 's';

    const mainSpan = document.createElement('span');
    mainSpan.textContent = c.text;
    btn.appendChild(mainSpan);

    if(c.inner){
      const innerSpan = document.createElement('span');
      innerSpan.className = 'inner';
      innerSpan.textContent = c.inner;
      btn.appendChild(innerSpan);
    }

    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      SFX.click();
      pickChoice(c);
    });
    box.appendChild(btn);
  });
  scrollBottom();
}

function pickChoice(c){
  pushHistory();
  if(c.effects){
    if(c.effects.trust) state.trust += c.effects.trust;
    if(c.effects.guilt) state.guilt += c.effects.guilt;
    if(c.effects.flag)  state.flags[c.effects.flag] = true;
  }
  waiting = false;
  let nid = c.next;
  if(typeof nid === 'function') nid = nid(state);
  loadNode(nid);
}

const ENDING_NAMES = {
  reborn:'结局 · 新生', assimilate:'结局 · 同化', symbiosis:'结局 · 共生',
  oblivion:'结局 · 遗忘', eternalnight:'结局 · 永夜'
};

const ENDING_COLORS = {
  reborn:'#e8c98a', symbiosis:'#c0b4dc', assimilate:'#c07070',
  oblivion:'#909090', eternalnight:'#e03030'
};

function renderEnding(id){
  unlockEnding(id);
  const box = $('choices');

  const mark = document.createElement('div');
  mark.className = 'ending-mark';
  mark.textContent = ENDING_NAMES[id] || '结局';
  box.appendChild(mark);

  const restartBtn = document.createElement('button');
  restartBtn.className = 'restart-btn';
  restartBtn.textContent = '重新开始';
  restartBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    SFX.click();
    resetState();
    history = [];
    replayMode = false;
    loadNode('start');
  });
  box.appendChild(restartBtn);

  const homeBtn = document.createElement('button');
  homeBtn.className = 'home-btn';
  homeBtn.textContent = '回到首页';
  homeBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    SFX.click();
    returnToTitle();
  });
  box.appendChild(homeBtn);

  scrollBottom();
}

function returnToTitle(){
  $('game').classList.add('hidden');
  $('title-screen').classList.remove('hidden');
  document.body.classList.remove('dread');
  renderEndingsList();
}

function showNextButton(){
  if(nextBtn) return;
  if(node.choices || node.ending) return;

  nextBtn = document.createElement('button');
  nextBtn.className = 'next-btn';
  nextBtn.innerHTML = '继 续 <span class="arrow">▸</span>';
  nextBtn.addEventListener('click', ev => {
    ev.stopPropagation();
    SFX.advance();
    removeNextButton();
    advance();
  });
  $('choices').appendChild(nextBtn);
  scrollBottom();
}

function removeNextButton(){
  if(nextBtn && nextBtn.parentNode) nextBtn.parentNode.removeChild(nextBtn);
  nextBtn = null;
}

function updateFlower(){
  const el = $('flower-mark');
  el.textContent = FLOWER_MARKS[state.flower] || '◌';
  el.setAttribute('data-state', state.flower);
}

function scrollBottom(){
  requestAnimationFrame(() => {
    const s = $('scroll'); s.scrollTop = s.scrollHeight;
  });
}

function getUnlocked(){
  try{ return JSON.parse(localStorage.getItem('jingyi_endings') || '[]'); }
  catch(e){ return []; }
}
function unlockEnding(id){
  try{
    const arr = getUnlocked();
    if(!arr.includes(id)){
      arr.push(id);
      localStorage.setItem('jingyi_endings', JSON.stringify(arr));
    }
  }catch(e){}
}

function renderEndingsList(){
  const unlocked = getUnlocked();
  const order = ['reborn','assimilate','symbiosis','oblivion','eternalnight'];
  const el = $('endings-list');
  el.innerHTML = '';
  if(unlocked.length === 0) return;

  const title = document.createElement('div');
  title.className = 'el-title';
  title.textContent = '结局回廊';
  el.appendChild(title);

  order.forEach(k => {
    const got = unlocked.includes(k);
    const btn = document.createElement('button');
    btn.className = 'ending-link' + (got ? ' got' : ' locked');
    btn.textContent = got ? ENDING_NAMES[k] : '？？？';
    if(got){
      btn.style.color = ENDING_COLORS[k] || '#9c6b6b';
      const arrow = document.createElement('span');
      arrow.className = 'el-arrow';
      arrow.textContent = '重读 ›';
      btn.appendChild(arrow);
      btn.addEventListener('click', () => replayEnding(k));
    } else {
      btn.disabled = true;
    }
    el.appendChild(btn);
  });
}

function replayEnding(endingKey){
  const nodeId = 'ending_' + endingKey;
  if(!NODES[nodeId]) return;

  SFX.click();
  $('title-screen').classList.add('hidden');
  $('game').classList.remove('hidden');
  resetState();
  history = [];
  replayMode = true;
  loadNode(nodeId);
}

/* ============================================================
   事件绑定
============================================================ */
$('start-btn').addEventListener('click', e => {
  e.stopPropagation();
  ensureMusic();
  SFX.click();
  startGame();
});

$('back-btn').addEventListener('click', e => {
  e.stopPropagation();
  SFX.click();
  goBack();
});

$('music-btn').addEventListener('click', e => {
  e.stopPropagation();
  if(!Music.ctx) Music.init();
  Music.toggle();
  setMusicPref(Music.isPlaying);
  updateMusicBtn();
});

document.addEventListener('click', e => {
  if(e.target.closest('button')) return;
  if(!$('title-screen').classList.contains('hidden')) return;
  removeNextButton();
  SFX.advance();
  advance();
});

document.addEventListener('keydown', e => {
  if(e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){
    if(!$('title-screen').classList.contains('hidden')) return;
    if(e.target.closest('button')) return;
    removeNextButton();
    SFX.advance();
    advance();
  }
  if(e.key === 'Backspace'){
    if($('title-screen').classList.contains('hidden') && !$('back-btn').disabled){
      e.preventDefault();
      SFX.click();
      goBack();
    }
  }
});

let musicInitialized = false;
function ensureMusic(){
  if(musicInitialized) return;
  musicInitialized = true;
  if(getMusicPref()){
    Music.start();
    updateMusicBtn();
  }
}
document.addEventListener('click', ensureMusic);

renderEndingsList();
updateMusicBtn();
</script>
</body>
